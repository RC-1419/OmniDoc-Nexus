# NOT a complete compose file. Paste the `alertmanager:` block under `services:` and the
# `alertmanager_data:` line under `volumes:` in the compose file (next to prometheus).
services:
  alertmanager:
    logging: *logging
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    mem_limit: 64m
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    # no "ports": nothing outside Docker can reach it
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager_smtp_password:/etc/alertmanager/smtp_password:ro
      - alertmanager_data:/alertmanager

volumes:
  alertmanager_data:
