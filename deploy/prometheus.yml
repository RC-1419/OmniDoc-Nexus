# Prometheus reads the API's /metrics page every 30 seconds and keeps the numbers for 15 days.
# Nothing here is reachable from the internet: Caddy blocks /api/metrics and Prometheus itself
# only listens on 127.0.0.1 of the server (open it with an SSH tunnel, see README).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: omnidoc-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]