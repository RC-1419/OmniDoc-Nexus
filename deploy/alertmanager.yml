# Alertmanager receives the alerts Prometheus raises (deploy/prometheus-rules.yml) and emails them.
# It uses the same Gmail SMTP account as the app. The password is NOT in this file: it is read from
# ~/omnidoc/alertmanager_smtp_password on the server (created by hand, never committed to git).
# Alertmanager has no public port: only Prometheus, inside Docker, can reach it.
global:
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "rohit.96.chaurasia@gmail.com"
  smtp_auth_username: "rohit.96.chaurasia@gmail.com"
  smtp_auth_password_file: /etc/alertmanager/smtp_password
  smtp_require_tls: true

route:
  receiver: email
  group_by: [alertname]
  group_wait: 30s        # wait a little so alerts that start together arrive in one email
  group_interval: 5m
  repeat_interval: 12h   # a problem that stays open reminds you twice a day, not every minute

receivers:
  - name: email
    email_configs:
      - to: "rohit.96.chaurasia@gmail.com"
        send_resolved: true   # also tells you when the problem has gone away
