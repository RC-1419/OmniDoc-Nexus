# NOT a complete compose file. Paste the `prometheus:` block under `services:` and the
# `prometheus_data:` line under `volumes:` in ~/omnidoc/docker-compose.yml on the server.
services:
  prometheus:
    logging: *logging
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    mem_limit: 300m                  # the server is small; this keeps Prometheus from starving the app
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=500MB
    ports:
      - "127.0.0.1:9090:9090"        # server-only: reach it with  ssh -L 9090:127.0.0.1:9090 ...
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api

volumes:
  prometheus_data:
