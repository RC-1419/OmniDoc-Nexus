# SonarQube / SonarQube Cloud settings. Same file for both; the server address and token come from the environment.
sonar.projectKey=Omnidoc-Nexus
sonar.projectName=Omnidoc Nexus
# SonarQube Cloud only: also add  sonar.organization=<your-org-key>
sonar.sources=omnidoc,scripts,loadtest
sonar.tests=tests
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# coverage.xml is written by:  python -m pytest --cov=omnidoc --cov-report=xml
sonar.python.coverage.reportPaths=coverage.xml

# Not measured for coverage or duplication: tests, database migrations, the load-test helpers and the scratch scripts.
sonar.coverage.exclusions=tests/**,migrations/**,scripts/**,loadtest/**,omnidoc/ui/**
sonar.cpd.exclusions=tests/**,migrations/**
sonar.exclusions=**/__pycache__/**,loadtest/report/**,migrations/versions/**
