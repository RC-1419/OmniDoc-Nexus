# SonarQube / SonarQube Cloud settings. Same file for both; the server address and token come from the environment.
sonar.projectKey=Omnidoc-Nexus
sonar.projectName=Omnidoc Nexus
# SonarQube Cloud only: also add  sonar.organization=<your-org-key>
sonar.sources=omnidoc,scripts,loadtest
sonar.tests=tests
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# coverage.xml is written by:  python -m pytest --cov=omnidoc --cov-report=xml
sonar.python.coverage.reportPaths=coverage.xml

# Not measured for coverage or duplication: tests, database migrations, the load-test helpers and the scratch scripts.
sonar.coverage.exclusions=tests/**,migrations/**,scripts/**,loadtest/**,omnidoc/ui/**
sonar.cpd.exclusions=tests/**,migrations/**
sonar.exclusions=**/__pycache__/**,loadtest/report/**,migrations/versions/**

# Rules that are noise in test code and throw-away test scripts (not in the app code itself):
#   S9073 (one assert with "and"), S5778 (two calls inside pytest.raises), S1192 (repeated URL strings)
sonar.issue.ignore.multicriteria=t1,t2,t3,t4
sonar.issue.ignore.multicriteria.t1.ruleKey=python:S9073
sonar.issue.ignore.multicriteria.t1.resourceKey=tests/**
sonar.issue.ignore.multicriteria.t2.ruleKey=python:S5778
sonar.issue.ignore.multicriteria.t2.resourceKey=tests/**
sonar.issue.ignore.multicriteria.t3.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.t3.resourceKey=tests/**
sonar.issue.ignore.multicriteria.t4.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.t4.resourceKey=scripts/try_*.py