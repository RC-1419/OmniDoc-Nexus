name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read          # the workflow can only read the repository unless a job asks for more

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnidoc
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: omnidoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnidoc -d omnidoc"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Throwaway values for this test run only. No real keys or documents are used anywhere in CI.
      DATABASE_URL: postgresql+pg8000://omnidoc:ci_only_password@localhost:5432/omnidoc
      VAULT_DIR: /tmp/omnidoc-vault
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # SonarQube wants the full history to tell new code from old
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Create throwaway keys for this run
        run: |
          echo "VAULT_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
      - name: Check that all code compiles
        run: python -m compileall -q omnidoc scripts
      - name: Check that the database change scripts match the models
        run: python -m scripts.migrations check
      - name: Unit and integration tests (with coverage)
        run: python -m pytest --cov=omnidoc --cov-report=term --cov-report=xml
      - name: API walkthrough (real database and file encryption; AI, vector store and email are stand-ins)
        run: python -m scripts.try_api
      - name: SonarQube scan
        # Runs only when a SONAR_TOKEN secret exists (so forks and fresh clones still pass).
        # Set SONAR_HOST_URL as well if you use your own SonarQube server; leave it out for SonarQube Cloud.
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # lets this job publish the image to GitHub's container registry (GHCR)
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name (lower case, as the registry requires)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
